<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">typescript-eslint</title>
<desc id="desc">A clean animated banner for typescript-eslint</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1F2937"/>
    <stop offset="100%" stop-color="#0B1020"/>
    <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0%" stop-color="#818CF8" stop-opacity=".15"/>
    <stop offset="50%" stop-color="#818CF8" stop-opacity=".75"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".08"/>
    <animate attributeName="x1" values="-1;1;-1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2;0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="260" rx="24" fill="url(#bg)"/>
<circle cx="930" cy="68" r="110" fill="#818CF8" opacity=".16" filter="url(#blur)">
  <animate attributeName="cx" values="930;1000;930" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="68;120;68" dur="7s" repeatCount="indefinite"/>
</circle>
<path d="M-40 215 C220 120 430 300 680 180 S1050 80 1240 145" fill="none" stroke="url(#glow)" stroke-width="2">
  <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M-40 215 C220 120 430 300 680 180 S1050 80 1240 145;M-40 180 C220 290 430 100 680 205 S1050 260 1240 110;M-40 215 C220 120 430 300 680 180 S1050 80 1240 145"/>
</path>
<circle cx="95" cy="82" r="4" fill="#818CF8"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1110" cy="194" r="3" fill="#818CF8"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="72" y="118" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-1">typescript-eslint</text>
<text x="74" y="157" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="2">BUILD · SHIP · ITERATE</text>
<rect x="74" y="184" width="76" height="3" rx="2" fill="#818CF8"/>
</svg>